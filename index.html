<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer</title>
<script>
  // Set the theme before first paint so the page never flashes the wrong colours.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('av-theme'); } catch (e) {}
    var forced = /[?&]theme=(light|dark)/.exec(location.search);
    if (forced) saved = forced[1];
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="3" y="15" width="5" height="10" rx="1.5"/><rect x="11.5" y="9" width="5" height="16" rx="1.5"/>
        <rect x="20" y="3" width="5" height="22" rx="1.5"/>
      </svg>
      <span>Algorithm Visualizer</span>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Switch between light and dark theme" title="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>
    </button>
  </header>

  <nav class="sidebar" id="nav" aria-label="Algorithms"></nav>

  <main class="stage">
    <div class="stage-head">
      <div>
        <h1 id="algoName"></h1>
        <p id="algoTag"></p>
      </div>
      <div class="chips" id="complexity"></div>
    </div>

    <div class="toolbar" id="toolbar"></div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>

    <div class="transport">
      <div class="t-buttons">
        <button class="t-btn" id="btnStart" title="Back to the start" aria-label="Back to the start">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="t-btn" id="btnBack" title="Step back (←)" aria-label="Step back">
          <svg viewBox="0 0 24 24"><path d="M15.5 5v14L6 12z"/></svg></button>
        <button class="t-btn play" id="btnPlay" title="Play / pause (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
        <button class="t-btn" id="btnFwd" title="Step forward (→)" aria-label="Step forward">
          <svg viewBox="0 0 24 24"><path d="M8.5 5v14L18 12z"/></svg></button>
        <button class="t-btn" id="btnEnd" title="Jump to the end" aria-label="Jump to the end">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
      </div>
      <div class="t-scrub">
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step">
        <span class="t-count" id="count">Step 0 of 0</span>
      </div>
      <label class="t-speed">Speed
        <input type="range" id="speed" min="1" max="5" value="3" aria-label="Speed">
      </label>
    </div>
    <p class="keys"><kbd>Space</kbd> play or pause &nbsp; <kbd>←</kbd> <kbd>→</kbd> step &nbsp; <kbd>R</kbd> new input</p>
  </main>

  <aside class="panel">
    <section class="card now">
      <h2>What's happening</h2>
      <p id="msg"></p>
      <div class="stats" id="stats"></div>
    </section>
    <section class="card">
      <h2>Pseudocode</h2>
      <ol class="code" id="code"></ol>
    </section>
    <section class="card">
      <h2>How it works</h2>
      <p id="about"></p>
    </section>
  </aside>
</div>

<script src="js/sorting.js"></script>
<script src="js/searching.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/arrayView.js"></script>
<script src="js/gridView.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
